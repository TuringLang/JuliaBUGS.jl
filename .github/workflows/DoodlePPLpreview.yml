name: DoodlePPL PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'DoodlePPL/**'
      - '.github/workflows/DoodlePPLpreview.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Deploy preview to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: DoodlePPL
          target-folder: DoodlePPL/pr-previews/${{ github.event.pull_request.number }}
          clean: false
          commit-message: "DoodlePPL: Deploy preview for PR ${{ github.event.pull_request.number }}"

      - name: Comment with preview URL
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            <!-- preview-url-comment -->
            A preview of this pull request has been deployed.
            **[https://turinglang.org/JuliaBUGS.jl/DoodlePPL/pr-previews/${{ github.event.pull_request.number }}](https://turinglang.github.io/JuliaBUGS.jl/DoodlePPL/pr-previews/${{ github.event.pull_request.number }})**
          comment-tag: preview-url-comment

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove PR preview
        run: |
          if [ -d "DoodlePPL/pr-previews/${{ github.event.pull_request.number }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "DoodlePPL/pr-previews/${{ github.event.pull_request.number }}"
            git commit -m "DoodlePPL: Remove preview for PR ${{ github.event.pull_request.number }}"
            git push
          else
            echo "Preview directory not found, skipping removal."
          fi
